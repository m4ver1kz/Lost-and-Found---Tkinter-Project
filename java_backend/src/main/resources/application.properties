# ============================================================================
# Spring Boot Configuration - Lost and Found Management System
# ============================================================================

# Server Port
server.port=${SERVER_PORT:8080}

# Application Name
spring.application.name=lost-and-found-backend

# Optional import of local configuration file for developers (excluded from Git)
spring.config.import=optional:classpath:application-local.properties

# Database Connectivity via JDBC & MySQL
# Credentials are read from Environment Variables or application-local.properties.
# No sensitive credentials are hardcoded here.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lost_and_found}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000

# JSON Date Formatting
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=UTC

# Logging
logging.level.root=INFO
logging.level.com.lostandfound=DEBUG
